# =====================================================================
#  校园网账号 —— 顺枫公寓自动登录用
#
#  这里【故意留空】：固件镜像里不带个人账号，避免学号密码被写进去。
#  刷完固件后有兩種填法：
#    ① 网页：服务 → 顺枫公寓自动登录 → 账号设置 → 填学号/密码 → 保存账号并重启
#    ② 命令行：vi /etc/auth.conf 改下面两行，然后 /etc/init.d/netcheck restart
#
#  提醒：这里一旦填上，再重新编译固件就等于把自己的账号公开出去了，
#        所以仓库里的这个文件请一直保持为空。
# =====================================================================
USERNAME=
PASSWORD=

# ---------- 以下可选，脚本会自动探测，一般不用改 ----------
# DEBUG=1
# UA=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
# HTTP_TIMEOUT=8
# POST_TIMEOUT=20
# WAIT_AFTER_LOGIN=3
# DETECT_URLS=http://connect.rom.miui.com/generate_204 http://www.baidu.com