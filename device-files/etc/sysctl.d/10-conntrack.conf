# UA3F 是 TPROXY 全量接管 TCP，连接数比普通家用高不少。
# 默认 nf_conntrack_max 在 128MB 机器上只有 16384，打满时新连接会直接失败，
# 表现就是"网突然断几秒又自己好了"。这里抬到 32768，并把已建立连接的
# 超时从默认 5 天缩到 1 天，让表能及时回收。
net.netfilter.nf_conntrack_max = 32768
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30