# /etc/netcheck.conf  --  optional settings for netcheck.sh
# Leave everything commented out to use the built-in defaults.

# Seconds between checks. 1 = fastest (a tiny probe every second).
#CHECK_INTERVAL=2

# Seconds to pause after a login attempt before checking again.
#COOLDOWN=6

# curl timeout (seconds) for a single probe.
#CHECK_TIMEOUT=4

# The login script to call when offline.
AUTH_SCRIPT=/usr/bin/auth.sh

# Where the log is written, and how many lines to keep.
#LOG_FILE=/tmp/netcheck.log
#LOG_MAX_LINES=1000

# Clear the log automatically every N days (0 = never clear).
# The countdown is kept in /etc/.netcheck.rotate so it survives a reboot.
#LOG_KEEP_DAYS=2

# How the auth output is written into the log. Pick one:
#   detail : "auth result:" then the output, one line each   (default)
#   fold   : the whole output on a single line, joined by ';'
#   brief  : one short line with only the final verdict
#LOG_STYLE=detail

# Where the raw output of the last auth attempt is kept (troubleshooting).
#DETAIL_FILE=/tmp/auth_last.log

# Probe URLs (a 204 from the first one means "online").
#PROBE_204=http://connect.rom.miui.com/generate_204
#PROBE_FALLBACK=http://www.baidu.com
