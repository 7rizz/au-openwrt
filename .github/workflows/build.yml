name: 编译红米AC2100固件

# ---------------------------------------------------------------------
# 用法：
#   1) 把本仓库推到 GitHub（公开仓库免费无限时长，私有仓库每月 2000 分钟）
#   2) 进入仓库页面 -> Actions -> 左边选“编译红米AC2100固件” -> Run workflow
#   3) 等 60~120 分钟，构建完成后在该次运行的 Artifacts 里下载固件
# 也可以直接改本文件或 configs/、device-files/ 下的内容再 push，自动触发编译
# ---------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt 源码版本标签"
        required: false
        default: "v24.10.8"
      profile:
        description: "编译哪个版本：campus=校园网防检测版(推荐) / full=全能版"
        required: false
        default: "campus"
      device:
        description: "机型代号（默认红米AC2100；其它型号见 configs/devices.list 第 1 列）"
        required: false
        default: "xiaomi_redmi-router-ac2100"
      variant:
        description: "full=完整版(含UA3F,需≥32MB闪存) / lite=精简版(只留UA2F,给16MB及以下老机器)"
        required: false
        default: "full"
      rootpw:
        description: "root 初始登录密码"
        required: false
        default: "root"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "device-files/**"

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      - name: 2. 释放磁盘空间
        run: |
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: 3. 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget subversion

      - name: 4. 克隆 OpenWrt 源码
        env:
          OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v24.10.8' }}
        run: |
          git clone --depth=1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "源码版本：$(git log -1 --format='%h %ad %s' --date=short)"

      - name: 5. 添加第三方插件源
        env:
          PROFILE: ${{ github.event.inputs.profile || 'campus' }}
        run: |
          cd openwrt
          # Argon 主题（支持 24.10，带暗色 + 自己的设置页）：两个版本都带上
          # 注意：不要用 Design 主题（luci-theme-design），那是 LEDE 时代的老式 Lua 主题，
          # 在 24.10 上会导致后台报错（header.htm 里 __entries 为 nil）。
          if ! grep -q "luci-theme-argon" feeds.conf.default; then
            echo "src-git argon_theme https://github.com/jerrykuku/luci-theme-argon.git;master" >> feeds.conf.default
          fi
          if ! grep -q "luci-app-argon-config" feeds.conf.default; then
            echo "src-git argon_config https://github.com/jerrykuku/luci-app-argon-config.git;master" >> feeds.conf.default
          fi
          # 全能版才需要那个大插件源；校园网版只用官方源 + 已内置的 UA3F/UA2F，编译更稳
          if [ "$PROFILE" = "full" ]; then
            if ! grep -q "kenzok8/small-package" feeds.conf.default; then
              echo "src-git small https://github.com/kenzok8/small-package.git;main" >> feeds.conf.default
            fi
          fi
          cat feeds.conf.default

      - name: 6. 更新并安装全部软件源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 7a. 生成 root 密码哈希（编译时算好，首次开机写进系统）
        env:
          ROOT_PW: ${{ github.event.inputs.rootpw || 'root' }}
        run: |
          cat > /tmp/mkhash.py <<'PY'
          import crypt, sys
          pw = sys.argv[1]
          try:
              salt = crypt.mksalt(crypt.METHOD_MD5)
          except Exception:
              salt = "$1$openwrt1"
          sys.stdout.write(crypt.crypt(pw, salt) or "")
          PY
          HASH="$(python3 /tmp/mkhash.py "$ROOT_PW" 2>/dev/null || true)"
          if [ -z "$HASH" ]; then
            HASH="$(openssl passwd -1 -salt openwrt1 "$ROOT_PW" 2>/dev/null || true)"
          fi
          if [ -z "$HASH" ]; then
            echo "!! 无法生成密码哈希，请检查 runner 的 python3/openssl"; exit 1
          fi
          # 自检：算出来的哈希必须能反验证通过，否则直接失败，避免刷完没密码
          python3 - "$HASH" "$ROOT_PW" <<'PY'
          import crypt, sys
          h, pw = sys.argv[1], sys.argv[2]
          ok = bool(h) and crypt.crypt(pw, h) == h
          print("密码哈希自检：", "通过" if ok else "失败")
          sys.exit(0 if ok else 1)
          PY
          mkdir -p openwrt/files/etc
          printf '%s' "$HASH" > openwrt/files/etc/rootpw.hash
          echo "已生成 root 密码哈希（密码本身不写进固件，只写哈希）"

      - name: 7. 注入自定义文件（首次开机设置、无线、UA3F/UA2F、校园网登录）
        env:
          VARIANT: ${{ github.event.inputs.variant || 'full' }}
        run: |
          mkdir -p openwrt/files
          cp -a device-files/. openwrt/files/
          # UA2F 已弃用（它在 24.10 上跑不通：TPROXY 规则被内核拒绝），
          # 镜像里不再带它，只保留 UA3F。
          rm -f openwrt/files/usr/bin/ua2f \
                openwrt/files/etc/init.d/ua2f \
                openwrt/files/etc/config/ua2f
          # lite 版：小闪存机器装不下 17MB 的 UA3F，去掉它，只留 UA2F
          if [ "$VARIANT" = "lite" ]; then
            echo "==== lite 版：移除 UA3F，只保留 UA2F ===="
            rm -rf openwrt/files/usr/bin/ua3f \
                   openwrt/files/etc/init.d/ua3f \
                   openwrt/files/etc/config/ua3f \
                   openwrt/files/etc/uci-defaults/luci-ua3f \
                   openwrt/files/usr/lib/lua/luci/controller/ua3f.lua \
                   openwrt/files/usr/lib/lua/luci/model/cbi/ua3f.lua \
                   openwrt/files/usr/lib/lua/luci/model/cbi/ua3f \
                   openwrt/files/usr/lib/lua/luci/view/ua3f \
                   openwrt/files/usr/lib/lua/luci/i18n/ua3f.zh-cn.lmo \
                   openwrt/files/www/luci-static/resources/ua3f
            # 防检测中心默认引擎改成 UA2F
            sed -i "s/option engine 'ua3f'/option engine 'ua2f'/" openwrt/files/etc/config/uadetect
          fi
          # 恢复可执行权限（二进制和脚本必须能执行）
          find openwrt/files -type d -exec chmod 0755 {} +
          find openwrt/files -type f -exec chmod 0644 {} +
          chmod 0755 openwrt/files/etc/init.d/*   2>/dev/null || true
          chmod 0755 openwrt/files/etc/uci-defaults/* 2>/dev/null || true
          chmod 0755 openwrt/files/usr/bin/*      2>/dev/null || true
          chmod 0755 openwrt/files/usr/sbin/*     2>/dev/null || true
          chmod 0755 openwrt/files/usr/libexec/*  2>/dev/null || true
          chmod 0755 openwrt/files/root/*.sh      2>/dev/null || true
          find openwrt/files -type f

      - name: 8. 生成 .config
        env:
          PROFILE: ${{ github.event.inputs.profile || 'campus' }}
          DEVICE: ${{ github.event.inputs.device || 'xiaomi_redmi-router-ac2100' }}
        run: |
          cd openwrt
          case "$PROFILE" in
            full) SEED=../configs/ac2100.seed ;;
            *)    SEED=../configs/ac2100-campus.seed ;;
          esac
          TARGET="$(awk -F'|' -v d="$DEVICE" '$1==d {print $2}' ../configs/devices.list)"
          SUBTARGET="$(awk -F'|' -v d="$DEVICE" '$1==d {print $3}' ../configs/devices.list)"
          MODEL="$(awk -F'|' -v d="$DEVICE" '$1==d {print $4}' ../configs/devices.list)"
          if [ -z "$TARGET" ] || [ -z "$SUBTARGET" ]; then
            echo "!! 机型代号 '$DEVICE' 不在 configs/devices.list 里，请检查第一列"
            awk -F'|' '!/^#/ && NF>3 {printf "   %-36s %s\n", $1, $4}' ../configs/devices.list
            exit 1
          fi
          echo "机型：$MODEL ($DEVICE)   平台：$TARGET/$SUBTARGET   版本：$PROFILE"
          cp "$SEED" .config
          # 用选中的机型替换掉配置文件里的目标设备三行
          grep -v '^CONFIG_TARGET_' .config > .config.new && mv .config.new .config
          {
            echo "CONFIG_TARGET_${TARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE}=y"
          } >> .config
          make defconfig
          echo "=========== 目标设备 ==========="
          grep -E "^CONFIG_TARGET_[a-z0-9_]+=" .config || true
          echo "=========== 关键插件是否选中 ==========="
          grep -E "^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall|luci-app-ssr-plus|luci-app-adguardhome|luci-theme-argon|luci-app-mwan3|dnsmasq-full|luci-compat|ipset|iptables-mod-tproxy|kmod-nft-queue|libnetfilter-queue1|curl|tcpdump)=" .config || true

      - name: 9. 下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: 10. 编译（失败会自动用单线程重跑一次以显示真正的报错）
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: 11. 整理产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -name '*.bin' -exec cp -v {} out/ \;
          find openwrt/bin/targets -name 'sha256sums' -exec cp -v {} out/ \;
          ls -lh out

      - name: 12. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.device || 'xiaomi_redmi-router-ac2100' }}-${{ github.run_number }}
          path: out
          if-no-files-found: error
          retention-days: 30
